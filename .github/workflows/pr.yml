name: PR

# The gate this repo did not have.
#
# `release.yml` triggers only on a push to main (or a `v*` tag), so until
# now NOTHING built the service image or ran its tests before a merge.
# That is how `3a888c5` landed a `replace` pointing at a sibling checkout
# that exists on exactly one operator's laptop: `main` went red on the
# first post-merge Release, the image stream stopped, and the revert
# (`#35`) was the only way back. A `go mod download` failure is cheap to
# catch and expensive to discover after merge — so catch it here.
#
# Three jobs, deliberately: the image build alone would catch the module
# graph breaking, but not a test regression; `go test ./...` in service/
# alone would not catch a Dockerfile that cannot fetch the private
# dependency; and neither would run the plugin module's tests.
#
# Not covered here: the plugin *binaries*. They are the slow, memory-
# pinned half of `release.yml` (see its OOM notes). Their TESTS are a
# different thing and are covered — `go test` in `plugin/` needs no
# cross-compilation, no `-ldflags`, and no credential (the only
# simple-container dep is the public `api` module), so the reason to
# skip the binaries is not a reason to skip the tests. It matters: the
# Schema response the plugin returns IS the component's published
# config contract, and `main_test.go` asserts the invariant that every
# ComponentSecretEnvMap key is actually writable by an operator. Without
# this job that test exists and never runs — the shape live-caught on
# observatory before `plugin-test` was added there in commit `308f3b8`.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  service-test:
    name: Build + test the service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # service/go.mod routes github.com/FerretDB/FerretDB to the PRIVATE
      # fork github.com/simple-container-com/go-embedb, so even `go build`
      # needs a read credential — the replace is resolved while loading the
      # module graph, long before any build tag or env var is consulted.
      #
      # Decrypted from this repo's own SC registry with the single
      # org-level SC_CONFIG. A pull request from a FORK gets no secret and
      # fails loudly on the `test -s` below, which is the right direction:
      # these are private repos and every PR is branch-based.
      - uses: simple-container-com/actions/install-sc@main
      - name: Reveal the go-embedb deploy key
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          # `sc secrets reveal` writes 0644. ssh refuses a world-readable
          # private key outright ("bad permissions") and then reports the
          # fetch as `Permission denied (publickey)`, which reads like the
          # wrong key rather than the wrong mode.
          chmod 600 .sc/deploy-keys/go-embedb.pem

      # internal/ui embeds the built SPA with `go:embed all:dist`, so the
      # Go package does not compile until the bundle exists. Same two
      # commands the Dockerfile's ui-builder stage runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: service/internal/ui/package-lock.json
      - name: Build the SPA
        working-directory: service/internal/ui
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:prod

      - uses: actions/setup-go@v5
        with:
          # From go.mod rather than a literal, so the toolchain never
          # drifts from what the Dockerfile and the operators build with.
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      # `go test`, not `go build`: `go build ./...` does not compile test
      # packages, so it happily ships a tree whose _test.go files no longer
      # build (fleet CLAUDE.md records the round-trip this cost).
      - name: Test
        working-directory: service
        env:
          # Keeps the private module off the public proxy (which cannot
          # read it and reports git's auth failure as a misleading
          # `invalid version`) and off the checksum database.
          GOPRIVATE: github.com/simple-container-com/*
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          export GIT_SSH_COMMAND="ssh -i ${GITHUB_WORKSPACE}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          go test ./... -count=1
          # A dirty go.mod/go.sum after a build means the committed pins do
          # not describe the module graph — the next CI run would resolve
          # something different.
          git diff --exit-code go.mod go.sum

  plugin-test:
    name: Build + test the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `sc secrets reveal` and no `GOPRIVATE` — plugin/go.mod
      # replaces the sibling `api` module with `../api` (works in a
      # checkout) and its only other simple-container dependency is the
      # public `simple-container-com/api`. If a private dep is ever added
      # here, this job starts failing in `go mod download` and the fix is
      # to copy the reveal + GOPRIVATE block from the service job above.
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Test
        working-directory: plugin
        run: |
          set -euo pipefail
          go test ./... -count=1
          git diff --exit-code go.mod go.sum

  # Asserts the tests actually catch the faults they claim to. See
  # hack/mutation-check.py — it breaks one guard at a time and requires
  # the matching test to go red. This is what distinguishes a regression
  # test from a test that merely agrees with the code as written; it
  # already live-caught a tenants_register test weaker than its name
  # (TestTenantsRegister_JWTMismatch only catches the body-tenant
  # mismatch, not the op gate — mintTestJWT hard-codes op:"register").
  #
  # Ported from sc-component-notifier's CI shape verbatim. The two
  # version-wire entries at the bottom of MUTATIONS are the ones this
  # repo earns its own harness for: a value present, correct, and read
  # by nothing, logging identically to a working deploy. That exact
  # shape has shipped TWICE in this fleet (signingKey as a bare ARN on
  # backup-smoke-1d 2026-11-14, then BACKUP_OPERATOR_PASSWORD on the
  # first backup.simple-forge.com login 2026-11-18).
  mutation-check:
    runs-on: ubuntu-latest
    name: mutation check
    steps:
      - uses: actions/checkout@v4

      # service's private go-embedb dep needs the reveal to resolve.
      # Same credential path as the `service-test` job above.
      - uses: simple-container-com/actions/install-sc@main
      - name: Reveal the go-embedb deploy key
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          chmod 600 .sc/deploy-keys/go-embedb.pem

      # internal/ui embeds the built SPA with `go:embed all:dist`, so
      # the Go package does not compile until the bundle exists. The
      # binary test TestBinaryReportsItsBuildOnHealthzAndSession links
      # cmd/backup (which transitively imports internal/ui), so we need
      # the dist produced here too. Same two commands service-test runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: service/internal/ui/package-lock.json
      - name: Build the SPA
        working-directory: service/internal/ui
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:prod

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      # Warm the build cache once per module, so the one `go test -run`
      # call per mutation doesn't each pay for a cold compile. Both
      # modules: the harness mutates service/ AND plugin/.
      #
      # Non-fatal on purpose: this step only warms a cache, and the
      # mutation loop re-fetches whatever is missing. Gating the job
      # on it turns a module-proxy hiccup into a red PR (notifier's
      # first run of this step hit exactly that).
      - name: prime build cache
        continue-on-error: true
        env:
          GOPRIVATE: github.com/simple-container-com/*
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          (cd service && go test ./... -count=1 -run XXXNONE)
          (cd plugin  && go test ./... -count=1 -run XXXNONE)

      - name: mutation check
        env:
          GOPRIVATE: github.com/simple-container-com/*
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: python3 hack/mutation-check.py

      # A mutation that is written back incorrectly would leave the tree
      # dirty. Cheap insurance against the harness itself lying.
      #
      # `npm install` above may rewrite service/internal/ui/package-lock.json
      # (name + version when cached lockfile metadata differs from
      # package.json). That has nothing to do with the mutation harness
      # itself — the harness never touches package-lock.json. Exclude it
      # from the restoration check so an unrelated node-side churn
      # doesn't mask a harness undo-failure.
      - name: tree restored
        run: |
          set -euo pipefail
          git checkout -- service/internal/ui/package-lock.json 2>/dev/null || true
          git diff --exit-code

  image:
    name: Build the service image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: simple-container-com/actions/install-sc@main
      - name: Reveal the go-embedb deploy key
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          chmod 600 .sc/deploy-keys/go-embedb.pem

      - uses: docker/setup-buildx-action@v3

      # Same inputs as the release build minus `push`, so a green run here
      # means the release build will get as far as the registry. amd64 only,
      # for the reason release.yml records (arm64 under QEMU: ~25 min).
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: service
          file: service/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            go_embedb_key=.sc/deploy-keys/go-embedb.pem
          build-args: |
            VERSION=0.0.0-pr
            COMMIT=${{ github.sha }}
